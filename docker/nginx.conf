worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 30m;
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/pdf
        application/xml
        image/svg+xml
        text/css
        text/plain;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 /404.html;

        # Preserve search equity from the pre-2026 Bitrix URL structure.
        # These server-level rewrites run before static-file and route lookup.
        rewrite ^/catalog/tsentralnye_karkasnye_konditsionery_rik_m_i_rik_s/?$ /product/centralnye-ustanovki/ permanent;
        rewrite ^/catalog/klapana_protivopozharnye_kanalnye_/?$ /product/protivopozharnye-klapany/ permanent;
        rewrite ^/catalog/sektsii_plastinchatykh_rekuperatorov_rp/?$ /product/centralnye-ustanovki/plastinchatye-rekuperatory/ permanent;
        rewrite ^/catalog/kanalnoe_oborudovanie/?$ /product/kanalnoe-oborudovanie/ permanent;
        rewrite ^/company/blog/printsip_raboty_tsentralnykh_karkasno_panelnykh_konditsionerov/?$ /product/centralnye-ustanovki/ permanent;
        rewrite ^/catalog/klapana/?$ /product/specialnye-klapany/ permanent;
        rewrite ^/upload/medialibrary/0bd/ayn0ko0zc8e8gc38960kbcyhwb816coe\.pdf$ /product/centralnye-ustanovki/ permanent;
        rewrite ^/catalog/ventilyatory_kanalnye_wr_i_wrn/?$ /product/ventilyator-wr/ permanent;
        rewrite ^/catalog/zatvory/?$ /product/ventilyatsionnye-zatvory/ permanent;
        rewrite ^/catalog/kanalnoe_krugloe_oborudovanie/?$ /product/kanalnoe-krugloe/ permanent;
        rewrite ^/catalog/plastinchatye_rekuperatory_rec/?$ /product/plastinchatyj-rekuperator-rec/ permanent;
        rewrite ^/catalog/reguliruyushchie_zaslonki_s/?$ /product/zaslonka-reguliruyushchaya-rkz/ permanent;
        rewrite ^/catalog/elektricheskie_vozdukhonagrevateli_euuu/?$ /product/elektricheskie-vozduhonagrevateli-re/ permanent;
        rewrite ^/catalog/nerzhaveyushchaya_stal_ot_0_5_do_1_0/?$ /product/vozduhovody-i-fasonnye-izdeliya/ permanent;
        rewrite ^/catalog/ventilyatory_kanalnye_/?$ /product/kanalnoe-oborudovanie/ permanent;
        rewrite ^/catalog/zonty_kryshnyy/?$ /product/vozduhovody-i-fasonnye-izdeliya/ permanent;
        rewrite ^/company/blog/printsip_raboty_vozdushnykh_zaslonok_ruchnye_mekhanicheskie_i_avtomaticheskie/?$ /product/specialnye-klapany/ permanent;
        rewrite ^/upload/medialibrary/3eb/5tftc56ji3vyx6gj8q51x7ckr0lv6224\.pdf$ /product/protivopozharnye-klapany/ permanent;
        rewrite ^/catalog/?$ /products/ permanent;
        rewrite ^/catalog/kanalnoe_pryamougolnoe_oborudovanie/?$ /product/kanalnoe-pryamougolnoe/ permanent;
        rewrite ^/company/?$ /about/ permanent;
        rewrite ^/company/articles/?$ /projects/ permanent;
        rewrite ^/company/rekvizity/?$ /requisites/ permanent;
        rewrite ^/company/jobs/?$ /careers/ permanent;
        rewrite ^/dostavka-oplata-garantii/?$ /about/ permanent;
        rewrite ^/dostavka-oplata-garantii/dostavka/?$ /contacts/ permanent;
        rewrite ^/dostavka-oplata-garantii/garantii/?$ /about/ permanent;
        rewrite ^/dostavka-oplata-garantii/oplata/?$ /contacts/ permanent;
        rewrite ^/izgotovlenie-na-zakaz/?$ /production/ permanent;
        rewrite ^/sale/sad/?$ /news/ permanent;
        rewrite ^/help/delivery/?$ /contacts/ permanent;
        rewrite ^/kak-oformit-zakaz/?$ /request/ permanent;
        rewrite ^/legacy-cookies-agreement\.php$ /privacy/ permanent;
        rewrite ^/info/brands/sony/?$ /production/ permanent;
        rewrite ^/auth/?$ / permanent;
        rewrite ^/contacts/stores/s1/?$ /contacts/ permanent;

        # Indexed legacy model cards keep the closest current product/category intent.
        # Final namespace fallbacks prevent any remaining Bitrix result from landing on 404.
        rewrite ^/catalog/sektsii_plastinchatykh_rekuperatorov_rp/[0-9]+/?$ /product/centralnye-ustanovki/plastinchatye-rekuperatory/ permanent;
        rewrite ^/catalog/elektricheskie_vozdukhonagrevateli_euuu/[0-9]+/?$ /product/centralnye-ustanovki/elektricheskie-nagrevateli/ permanent;
        rewrite ^/catalog/sektsiya_isparitelya_freonovogo_cxy/[0-9]+/?$ /product/centralnye-ustanovki/freonovye-ohladiteli/ permanent;
        rewrite ^/catalog/filtr_f[123](?:/[0-9]+)?/?$ /product/centralnye-ustanovki/sekcii-filtracii/ permanent;
        rewrite ^/catalog/vodyanye_vozdukhonagrevateli_hx/[0-9]+/?$ /product/centralnye-ustanovki/vodyanye-nagrevateli/ permanent;
        rewrite ^/catalog/sektsii_ventilyatorov_/[0-9]+/?$ /product/centralnye-ustanovki/ventilyatornye-sekcii/ permanent;
        rewrite ^/catalog/sektsii_smesheniya_vozdukha_r_pu_pd_pl_pr_i_promezhutochnye_sektsii_u_/[0-9]+/?$ /product/centralnye-ustanovki/sekcii-smesheniya/ permanent;
        rewrite ^/catalog/sektsii_vodyanogo_vozdukhookhladitelya_wxx/[0-9]+/?$ /product/centralnye-ustanovki/vodyanye-ohladiteli/ permanent;
        rewrite ^/catalog/sektsii_shumoglusheniya_y1_y2_y3/[0-9]+/?$ /product/centralnye-ustanovki/shumoglushiteli/ permanent;
        rewrite ^/catalog/sektsii_sotovogo_uvlazhnitelya_/[0-9]+/?$ /product/centralnye-ustanovki/sotovye-uvlazhniteli/ permanent;
        rewrite ^/catalog/sektsii_rotornykh_regeneratorov_rr/[0-9]+/?$ /product/centralnye-ustanovki/rotornye-regeneratory/ permanent;
        rewrite ^/catalog/rezervnaya_sistema_ventilyatsii/[0-9]+/?$ /product/centralnye-ustanovki/ventilyatornye-s-rezervom/ permanent;
        rewrite ^/catalog/ventilyatory_kryshnye_obshchepromyshlennye_krv_v/[0-9]+/?$ /product/ventilyatory-kryshnye-krv-v/ permanent;
        rewrite ^/catalog/kryshnye_ventilyatory_krv/[0-9]+/?$ /product/ventilyatory-kryshnye-krv/ permanent;
        rewrite ^/catalog/ventilyatory_radialnye_obshchepromyshlennye_rr/[0-9]+/?$ /product/ventilyatory-radialnye-rr/ permanent;
        rewrite ^/catalog/shumoglushiteli_kruglye/[0-9]+/?$ /product/shumoglushitel-rq-kruglyj/ permanent;
        rewrite ^/catalog/klapana_germeticheskie_ventilyatsionnye/[0-9]+/?$ /product/germeticheskie-klapany/ permanent;
        rewrite ^/catalog/klapan_izbytochnogo_davleniya_kid/[0-9]+/?$ /product/klapany-izbytochnogo-davleniya-kid/ permanent;
        rewrite ^/catalog/filtry_vozdushnye_kassetnye_(?:/[0-9]+)?/?$ /product/filtry-vozdushnye-kassetnye-rf/ permanent;
        rewrite ^/catalog/elektricheskie_vozdukhonagrevateli_/[0-9]+/?$ /product/elektricheskie-vozduhonagrevateli-re-kruglye/ permanent;
        rewrite ^/catalog/zaslonki_kruglye/?$ /product/kanalnoe-krugloe/ permanent;
        rewrite ^/catalog/vodyanye_vozdukhonagrevateli_/?$ /product/vodyanye-vozduhonagrevateli-rw-kruglye/ permanent;
        rewrite ^/catalog/obratnye_klapany_ro/?$ /product/klapan-obratnyj-ro-kruglyj/ permanent;
        rewrite ^/catalog/fankoyly(?:/.*)?/?$ /products/ permanent;
        rewrite ^/catalog(?:/.*)?/?$ /products/ permanent;
        rewrite ^/upload/medialibrary/.*\.pdf$ /tehlisty/ permanent;
        rewrite ^/company/blog(?:/.*)?/?$ /news/ permanent;
        rewrite ^/company(?:/.*)?/?$ /about/ permanent;
        rewrite ^/dostavka-oplata-garantii(?:/.*)?/?$ /contacts/ permanent;
        rewrite ^/sale(?:/.*)?/?$ /news/ permanent;
        rewrite ^/help(?:/.*)?/?$ /contacts/ permanent;

        location = /healthz {
            proxy_pass http://127.0.0.1:8011/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8011;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Do not forward a client-supplied chain. The application trusts
            # only this sanitized hop from the loopback nginx proxy.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /product/ventilyatorrrry-kryshnye-krv-v {
            return 301 /product/ventilyatory-kryshnye-krv-v/;
        }

        location = /downloads/RIK-full-catalog.pdf {
            return 301 /downloads/RIK-full-catalog-20260728.pdf;
        }

        location = /llms.txt {
            default_type text/plain;
            charset utf-8;
            try_files /llms.txt =404;
        }

        location = /404.html {
            internal;
        }

        location = / {
            try_files /index.html =404;
        }

        # Vite filenames are content-hashed, so they are safe to cache forever.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Product media changes rarely but filenames are not content-hashed.
        # Use a bounded cache so deployments can still replace them predictably.
        location ~* \.(?:png|jpe?g|gif|webp|svg|ico|mp4|webm|woff2?|ttf|eot)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        }

        # Static files must fail closed. Without this rule nginx returned the
        # SPA shell with HTTP 200 for missing assets and SEO control files.
        location ~* \.(?:css|js|mjs|json|xml|txt|png|jpe?g|gif|webp|svg|ico|mp4|webm|woff2?|ttf|eot|pdf|xlsx?|docx?|zip|pptx?|rfa|rvt)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
