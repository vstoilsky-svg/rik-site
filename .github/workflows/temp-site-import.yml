name: Temporary verified site import

on:
  push:
    branches:
      - codex/site-zero-known-gaps-20260805

permissions:
  contents: write

concurrency:
  group: temporary-site-import
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download and verify transfer archive
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/rik-site-transfer.zip
          curl -fL --retry 4 --retry-all-errors             https://github.com/vstoilsky-svg/rik-site/releases/download/codex-site-transfer-20260805-1710/rik-site-changes-dfe8115-20260805.zip             -o "$archive"
          echo "bd195238e6bee799b17d000f042b613a4e8fda7fdc83cb21b9ba41da80e2292f  $archive" | sha256sum -c -
          test "$(zipinfo -1 "$archive" | grep -vc '/$')" = "151"
          unzip -o "$archive" -d "$GITHUB_WORKSPACE"
          git restore --source=HEAD --worktree .github/workflows/ci.yml
          git diff --quiet -- .github/workflows/ci.yml

      - name: Commit verified non-workflow snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No imported changes found" >&2
            exit 1
          fi
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "150"
          git commit -m "fix: close desktop mobile and static asset gaps [site-import]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
