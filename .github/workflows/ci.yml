name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install, lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Backend install and tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pip install --require-hashes -r backend/requirements.lock.txt
          python -m unittest discover -s backend/tests -v
          python -m compileall -q backend/backend
          python -m pip check

      - name: Verify exact manifest parity
        shell: pwsh
        run: ./VERIFY-MANIFEST.ps1

      - name: Verify SEO self-review guard
        shell: pwsh
        run: ./VERIFY-SEO.ps1

      - name: Verify UI regression guards
        shell: pwsh
        run: ./VERIFY-UI.ps1

      - name: Verify public asset hygiene
        shell: pwsh
        run: ./VERIFY-PUBLIC.ps1

      - name: Scan complete Git history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git --redact --no-banner --config /repo/.gitleaks.toml /repo

      - name: Build and smoke-test production container
        shell: bash
        run: |
          set -euo pipefail
          docker build -t rik-site:ci .
          test "$(docker inspect --format '{{.Config.User}}' rik-site:ci)" = "rik"
          test "$(docker run --rm --entrypoint id rik-site:ci -u)" != "0"
          container="$(docker run -d -p 18080:8080 rik-site:ci)"
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'
          while IFS= read -r route; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080${route}")" = "200"
            test "$(curl -sSI -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080${route}")" = "200"
          done < <(node frontend/scripts/seo-artifacts.mjs --routes)
          for route in \
            /definitely-not-a-real-route \
            /nested/definitely-not-real \
            /Definitely-Not-A-Real-Route \
            /product/definitely-not-a-product \
            /product/centralnye-ustanovki/definitely-not-a-section \
            /recommendations/definitely-not-an-asset; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080${route}")" = "404"
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/product/ventilyatorrrry-kryshnye-krv-v)" = "301"
          test "$(curl -sS -o /dev/null -w '%{redirect_url}' http://127.0.0.1:18080/product/ventilyatorrrry-kryshnye-krv-v)" = "http://127.0.0.1:18080/product/ventilyatory-kryshnye-krv-v"
          curl -fsS http://127.0.0.1:18080/product/ventilyatory-kryshnye-krv-v | grep -q '<link rel="canonical" href="https://rik-vent.ru/product/ventilyatory-kryshnye-krv-v"'
          curl -fsS http://127.0.0.1:18080/product/ventilyatory-kryshnye-krv-v | grep -q 'id="rik-structured-data"'
          curl -fsS http://127.0.0.1:18080/robots.txt | grep -q '^User-agent: \*$'
          curl -fsS http://127.0.0.1:18080/sitemap.xml | grep -q '<urlset'
          curl -fsSI http://127.0.0.1:18080/llms.txt | tr -d '\r' | grep -qi '^content-type: text/plain; charset=utf-8$'
          curl -fsS http://127.0.0.1:18080/llms.txt | grep -q '^# РИК'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/assets/definitely-not-real.js)" = "404"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/definitely-not-real)" = "404"
          curl -sS http://127.0.0.1:18080/definitely-not-a-real-route | grep -q 'Страница не найдена'
